upload_max_filesize = 50M
post_max_size = 50M
mysql.default_socket = /tmp/mysql.sock
mysqli.default_socket = /tmp/mysql.sock

; Enable all errors except notices (FuelPHP expects visibility)
error_reporting = E_ALL & ~E_NOTICE
display_errors = Off       ; On in dev, Off in prod
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; File uploads
file_uploads = On
post_max_size = 12M

; Execution limits
max_execution_time = 30
memory_limit = 256M

; Timezone
date.timezone = Europe/Dublin

; Session settings (Fuel uses PHP sessions unless overridden)
session.gc_maxlifetime = 1440
session.cookie_httponly = 1
session.use_strict_mode = 1

; FuelPHP quirks
cgi.fix_pathinfo = 0        ; prevent path traversal issues

