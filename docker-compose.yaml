services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hockey_app
    volumes:
      - "./code/api:/var/www/html/fuel/app"
      - ./code/public:/var/www/html/public
      - ./data:/var/www/html/data
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini
    working_dir: /var/www/html
    entrypoint: sh -c "chown -R www-data:www-data /var/www/html/data && php-fpm"
    ports:
      - "127.0.0.1:9001:9000"
    depends_on:
      - db
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      - HOST_UID=${HOST_UID}
      - HOST_GID=${HOST_GID}
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - FUELPATH=/var/www/html/fuel/
      - DATAPATH=/var/www/html/data/

  db:
    image: mariadb:10.5
    container_name: hockey_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: hockey
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - ./data/db:/var/lib/mysql
      - ./code/db-init:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: hockey_admin
    environment:
      PMA_HOST: db
      PMA_USER: user
      PMA_PASSWORD: password
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - db

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api
    volumes:
      - ./code/apix:/app
      - ./data:/data:ro
    ports:
      - "8000:80"
    depends_on:
      - db

  nginx:
    image: nginx:stable
    container_name: hockey_nginx_local
    ports:
      - "8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./code/public:/var/www/html/public
    depends_on:
      - php
    profiles: ["development"]

volumes:
  db_data:

